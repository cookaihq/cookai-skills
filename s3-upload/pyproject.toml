# s3-upload 运行时环境（ADR 0007 §1.1/§1.2）。
# 本 skill 零第三方运行时依赖（全部标准库：urllib、hashlib、hmac、xml.etree），
# 但仍按 §1.2「纯 stdlib 不例外」自带 pyproject + uv.lock + `.python-version`：
# uv 据此钉死解释器版本，根治「系统 python3 版本漂移」这类问题。
# 重建环境：uv sync --project <本目录> --no-dev（venv 落 <本目录>/.venv，ADR 0007 §1.3）。
#
# 注意 scripts/setup.py 与 setuptools 的 setup.py 无关：scripts/ 是一个普通脚本
# 目录、不是包，且下面 [tool.uv] package = false 明确不做构建，uv / pip 不会把它
# 当构建脚本执行（没有 [build-system] 段，也不存在“以本目录为包根”的构建流程）。
# 解释器版本由同目录 `.python-version`（3.13）钉死，uv 原生读取并据此选定 /
# 下载解释器（ADR 0007 §1.2 + 沿革 1）。下面的 requires-python 只是**下限**，
# 单靠它 uv 会在不同机器选中不同解释器——本机 3.13、只有系统 3.9 的机器则 3.9，
# 正是要消除的分叉。bootstrap 片段仍须保持 3.9 兼容语法（系统解释器可能先执行它）。
[project]
name = "s3-upload"
version = "1.1.1"
description = "S3/OSS SigV4 上传与投递 skill 的运行时环境锁定"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
# 只在跑本仓测试时需要，不进运行时环境：bootstrap 的自动重建走 `--no-dev`，
# 跑测试时显式 `uv sync --project <本目录> --group dev`。
dev = [
    "pytest>=7.4",
]

[tool.uv]
# 脚本靠 sys.path 注入直接运行，不作为可安装包构建。
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
