# memoji-sticker-pack 运行时环境（ADR 0007 §1.1/§1.2）。
# 这里是 Python 依赖的唯一清单（cutout.py 用 numpy + Pillow 做绿幕键控与去绿边），
# 精确解析结果落在同目录 uv.lock。
# 重建环境：uv sync --project <本目录>（venv 落 <本目录>/.venv，ADR 0007 §1.3）。
[project]
name = "memoji-sticker-pack"
version = "1.2.0"
description = "memoji-sticker-pack skill 的运行时依赖锁定"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
]

[tool.uv]
# 脚本按路径直接运行，不作为可安装包构建。
package = false
