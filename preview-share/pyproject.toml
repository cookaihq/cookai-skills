# preview-share 运行时环境（ADR 0007 §1.1/§1.2）。
# 本 skill 零第三方依赖，但仍按 §1.2「纯 stdlib 不例外」自带 pyproject + uv.lock：
# uv 按下面的 `.python-version` 钉死解释器版本，避免「系统 python3 版本漂移」这类问题。
# 重建环境：uv sync --project <本目录> --no-dev（venv 落 <本目录>/.venv，ADR 0007 §1.3）。
# 解释器版本由同目录 `.python-version`（3.13）钉死，uv 原生读取并据此选定 /
# 下载解释器（ADR 0007 §1.2 + 沿革 1）。下面的 requires-python 只是**下限**，
# 单靠它 uv 会在不同机器选中不同解释器——本机 3.13、只有系统 3.9 的机器则 3.9，
# 正是要消除的分叉。bootstrap 片段仍须保持 3.9 兼容语法（系统解释器可能先执行它）。
[project]
name = "preview-share"
version = "1.1.0"
description = "本地文件经 FTP 上传到预览服务器的 skill 运行时环境锁定"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
# 只在跑本仓测试时需要，不进运行时环境：bootstrap 的自动重建走 `--no-dev`，
# 跑测试时显式 `uv sync --project <本目录> --group dev`。
# pytest 只在跑本仓测试时需要，放 dev 依赖组，不进运行时。
dev = [
    "pytest>=7.4",
]

[tool.uv]
# 脚本直接运行，不作为可安装包构建。
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
