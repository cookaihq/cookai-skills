# Python is pinned by .python-version; dependencies by uv.lock.
# Pandoc 3.10.1 is checked by the entry point and is not installed automatically.
[project]
name = "pdf2markdown"
version = "2.0.0"
description = "PDF conversion, page review and local comparison viewer"
requires-python = ">=3.10"
dependencies = [
    "PyMuPDF==1.28.0",
    "lxml==6.1.1",
    "nh3==0.3.6",
]

[dependency-groups]
# 只在跑本仓测试时需要，不进运行时环境：bootstrap 的自动重建走 `--no-dev`，
# 跑测试时显式 `uv sync --project <本目录> --group dev`。
dev = [
    "pytest>=7.4",
    "pyyaml>=6",
]

[tool.uv]
# 本 skill 的脚本靠 sys.path 注入直接运行，不作为可安装包构建。
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
